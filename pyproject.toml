[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimicry-enroll"
version = "0.1.0"
description = "НПБК enrollment server: biometric SSH key registration"
requires-python = ">=3.10"
dependencies = [
    "mimicry-preproc>=0.1.0",
    "npbk>=0.1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.35",
    "streamlit-webrtc>=0.47",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "cryptography>=42",
    "gostcrypto>=1.2",
    "numpy>=1.24",
    "msgpack>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
mimicry-enroll = "mimicry_enroll._run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mimicry_enroll"]
