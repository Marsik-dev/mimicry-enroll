services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mimicry_enroll
      POSTGRES_USER: mimicry
      POSTGRES_PASSWORD: mimicry123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimicry -d mimicry_enroll"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8502:8501"  # Streamlit UI
      - "8001:8000"  # FastAPI REST
    environment:
      DATABASE_URL: postgresql+psycopg://mimicry:mimicry123@db:5432/mimicry_enroll
      NEGATIVES_DIR: /data/negatives
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - negatives-cache:/data/negatives
      - ./certs:/app/certs:ro

volumes:
  pgdata:
  negatives-cache:
