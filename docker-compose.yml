services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mimicry_enroll
      POSTGRES_USER: mimicry
      POSTGRES_PASSWORD: mimicry123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimicry -d mimicry_enroll"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # network_mode: host нужен для WebRTC: aiortc должен видеть реальные
    # сетевые интерфейсы (192.168.x.y), иначе ICE-кандидаты с Docker bridge
    # (172.x.x.x) не доходят до телефона/удалённого браузера.
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://mimicry:mimicry123@localhost:5433/mimicry_enroll
      NEGATIVES_DIR: /data/negatives
      STREAMLIT_PORT: "8502"
      API_PORT: "8001"
      INTERNAL_API_URL: "http://localhost:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - negatives-cache:/data/negatives
      - ./certs:/app/certs:ro

volumes:
  pgdata:
  negatives-cache:
