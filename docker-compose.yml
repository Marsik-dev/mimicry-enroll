services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mimicry_enroll
      POSTGRES_USER: mimicry
      POSTGRES_PASSWORD: mimicry123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimicry -d mimicry_enroll"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8501:8501"  # Streamlit UI
      - "8000:8000"  # FastAPI REST
    environment:
      DATABASE_URL: postgresql+psycopg://mimicry:mimicry123@db:5432/mimicry_enroll
    depends_on:
      db:
        condition: service_healthy
    # Для разработки с локальными пакетами:
    # volumes:
    #   - ../mimicry-preproc/src:/app/mimicry_preproc_src:ro
    #   - ../npbk/src:/app/npbk_src:ro

volumes:
  pgdata:
